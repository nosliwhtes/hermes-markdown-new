[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-new"
version = "0.2.0"
description = "Dependency-free CLI for the Markdown.new API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
markdown-new = "markdown_new.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
